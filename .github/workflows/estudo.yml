name: Estudo (eventos)

# Experimentos da fase 1 que precisam baixar modelos (o que a máquina do Claude não consegue).
# Mede só contra o gabarito do repositório; não toca no banco nem manda avisos.
on:
  push:
    branches: ["claude/**"]
    paths: ["jobs/estudos/**", ".github/workflows/estudo.yml"]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  vetores:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Instalar (torch só para CPU)
        run: |
          pip install -r jobs/requirements.txt numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers
          pip list 2>/dev/null | grep -iE "^(torch|sentence-transformers|transformers) "

      - name: Medir no conjunto de desenvolvimento
        working-directory: jobs
        run: python estudos/eventos/vetores/medir.py
