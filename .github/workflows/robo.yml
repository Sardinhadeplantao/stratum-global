name: Robô (coleta e site)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # a cada 15 minutos, fora da hora cheia (o GitHub atrasa menos)
  workflow_dispatch:
    inputs:
      testar_telegram:
        description: "Mandar uma mensagem de teste no Telegram"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]

permissions: { contents: read, pages: write, id-token: write, actions: write }
concurrency: { group: "robo-${{ github.ref }}", cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    outputs:
      site_ligado: ${{ steps.pages.outputs.ligado }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: jobs/requirements.txt }

      - name: Testes do robô
        working-directory: jobs
        run: |
          pip install -r requirements.txt
          python -m pytest

      # Modelo de tradução gratuito (Argos, inglês → português do Brasil, decisão 0010): baixa uma vez e fica guardado
      - uses: actions/cache@v5
        with: { path: ~/.cache/stratum, key: modelo-argos-en_pb-1.9 }

      # Cópia local das cotações já lidas: o banco só manda as linhas novas. Ler todas a cada rodada gastaria uns
      # 17 GB/mês, e o Supabase gratuito dá 5 GB de saída (decisão 0013). Se o banco mudou, a cópia é descartada.
      - uses: actions/cache@v5
        with: { path: ~/.cache/stratum-observacoes, key: "observacoes-${{ github.ref_name }}-${{ github.run_id }}",
                restore-keys: "observacoes-${{ github.ref_name }}-" }

      - name: Data da última cópia do banco (decisão 0007)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ultima=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=copia-banco&per_page=100" \
                --jq '[.artifacts[].created_at] | max // ""'); then
            echo "STRATUM_ULTIMA_COPIA=$ultima" >> "$GITHUB_ENV"
          else
            echo "::warning::Não foi possível conferir a data da última cópia do banco."
          fi

      - name: Rodada do robô
        working-directory: jobs
        env:
          # Só a branch principal grava no banco de produção e manda avisos; as outras usam banco temporário
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.DATABASE_URL || '' }}
          # Ou só a senha do Supabase (segredo SUPABASE_SENHA); servidor e usuário do projeto não são segredo
          SUPABASE_SENHA: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_SENHA || '' }}
          SUPABASE_HOST: aws-0-us-east-2.pooler.supabase.com
          SUPABASE_USUARIO: postgres.ojtlxyfrcahhoifrcqbc
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_CHAT_ID || '' }}
          # Fora da main, imprime cada notícia com os países encontrados (para conferir a regra com dados reais)
          STRATUM_DIAGNOSTICO: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          STRATUM_TRADUCAO: "1"
          STRATUM_CACHE_OBSERVACOES: ~/.cache/stratum-observacoes/observacoes.json.gz
        run: python -m stratum.robo --exportar ../web/public/dados/status.json || echo "::warning::A rodada terminou com falhas. Veja a tela Método do site."

      - name: Teste do Telegram
        if: inputs.testar_telegram && github.ref == 'refs/heads/main'
        working-directory: jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stratum.avisos teste

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - name: Montar o site
        working-directory: web
        env: { BASE_PATH: "/${{ github.event.repository.name }}" }
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with: { path: web/out }

      - name: O site (GitHub Pages) está ligado?
        id: pages
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          saida=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>&1) || true
          if echo "$saida" | grep -q "HTTP 404"; then
            echo "ligado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::O site ainda não foi ligado: Settings → Pages → Source: GitHub Actions (docs/configurar.md)."
          elif [ "$saida" = "legacy" ]; then
            echo "ligado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::O site está ligado no modo antigo: em Settings → Pages, mude Source para GitHub Actions."
          else
            echo "ligado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Manter o agendamento ativo (o GitHub desliga agendamentos após 60 dias sem atividade)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for w in robo.yml copia.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$w/enable" || echo "não foi possível renovar o agendamento de $w"
          done

      # Por último, para ficar no fim do log: os números reais desta rodada, para conferir cada etapa sem abrir o site
      - name: Conferência da rodada
        if: always()
        working-directory: jobs
        run: python scripts/conferir_status.py ../web/public/dados/status.json || true

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.site_ligado == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
